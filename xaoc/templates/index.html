<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xaoc Cloud</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #0f0f0f;
            --border: #222222;
            --text: #ffffff;
            --text-muted: #888888;
            --accent: #ff3333;
            --green: #00ff88;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
        }

        h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        h2 span { color: var(--accent); }
        
        .global-status {
            font-size: 12px;
            color: var(--green);
            margin-bottom: 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input[type="password"] {
            width: 100%;
            background: #000;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
            font-family: monospace;
            text-align: center;
        }

        input[type="password"]:focus { border-color: var(--accent); }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.8; }
        .btn-start { background-color: var(--text); color: var(--bg); }
        .btn-stop { background-color: var(--accent); color: #fff; display: none; }

        .status { font-size: 13px; color: var(--text-muted); margin-top: 20px; min-height: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>xaoc<span>.</span></h2>
        <div class="global-status" id="global-count">0 bots online</div>
        
        <div id="connect-view">
            <input type="password" id="token" placeholder="Paste token here...">
            <button class="btn btn-start" onclick="startBot()">Host Selfbot</button>
        </div>
        
        <div id="active-view" style="display: none;">
            <p style="color: var(--green); margin-bottom: 20px; font-weight: 600;">Selfbot is running 24/7.</p>
            <button class="btn btn-stop" style="display: block;" onclick="stopBot()">Disconnect</button>
        </div>
        
        <div id="status-message" class="status"></div>
    </div>

    <script>
        async function checkStatus() {
            try {
                const res = await fetch('/api/status');
                const data = await res.json();
                
                document.getElementById('global-count').innerText = `${data.global} bots online`;
                
                if (data.status === 'running') {
                    document.getElementById('connect-view').style.display = 'none';
                    document.getElementById('active-view').style.display = 'block';
                } else {
                    document.getElementById('connect-view').style.display = 'block';
                    document.getElementById('active-view').style.display = 'none';
                }
            } catch (e) {}
        }

        async function startBot() {
            const token = document.getElementById('token').value;
            const statusText = document.getElementById('status-message');
            
            if (!token) {
                statusText.innerText = "Token required.";
                statusText.style.color = "var(--accent)";
                return;
            }

            statusText.innerText = "Validating token...";
            statusText.style.color = "#ffcc00";

            try {
                const res = await fetch('/api/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    statusText.innerText = data.message;
                    statusText.style.color = "var(--green)";
                    document.getElementById('token').value = '';
                    setTimeout(checkStatus, 1500); 
                } else {
                    statusText.innerText = "Error: " + data.error;
                    statusText.style.color = "var(--accent)";
                }
            } catch (err) {
                statusText.innerText = "Server offline";
                statusText.style.color = "var(--accent)";
            }
        }

        async function stopBot() {
            const statusText = document.getElementById('status-message');
            statusText.innerText = "Disconnecting...";
            statusText.style.color = "#ffcc00";

            try {
                const res = await fetch('/api/stop', { method: 'POST' });
                if (res.ok) {
                    statusText.innerText = "Offline";
                    statusText.style.color = "var(--text-muted)";
                    setTimeout(checkStatus, 1000);
                }
            } catch (err) {
                statusText.innerText = "Server offline";
                statusText.style.color = "var(--accent)";
            }
        }

        // Check status every 10 seconds to keep global count updated
        setInterval(checkStatus, 10000);
        window.onload = checkStatus;
    </script>

</body>
</html>
