<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xaoc Dashboard</title>
    <style>
        body {
            background-color: #0f0f0f;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .status {
            color: #00ff00;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0a0a0a;
            border: 1px solid #333;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
        }
        input:focus {
            border-color: #555;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: white;
            color: black;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #ddd;
        }
        .msg {
            margin-top: 20px;
            font-size: 14px;
            color: #00ff00;
        }
        .error {
            color: #ff4444;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Xaoc.</h1>
    <div class="status" id="statusText">0 BOTS ONLINE</div>
    
    <input type="password" id="tokenInput" placeholder="Paste token here...">
    <button onclick="startBot()" id="hostBtn">Host Selfbot</button>
    
    <div class="msg" id="messageText"></div>
</div>

<script>
    async function startBot() {
        const token = document.getElementById('tokenInput').value;
        const msg = document.getElementById('messageText');
        const btn = document.getElementById('hostBtn');
        
        if(!token) {
            msg.innerText = "Please paste a token.";
            msg.className = "msg error";
            return;
        }

        msg.innerText = "Connecting...";
        msg.className = "msg";
        btn.innerText = "Connecting...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/start', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            });
            
            const data = await res.json();
            
            if(res.ok) {
                msg.innerText = "Connected! Bot is running.";
                msg.className = "msg";
                btn.innerText = "Bot is Online";
                document.getElementById('statusText').innerText = "1 BOT ONLINE";
                document.getElementById('statusText').style.color = "#00ff00";
            } else {
                msg.innerText = data.error;
                msg.className = "msg error";
                btn.innerText = "Host Selfbot";
                btn.disabled = false;
            }
        } catch (e) {
            msg.innerText = "Server error.";
            msg.className = "msg error";
            btn.innerText = "Host Selfbot";
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
